stages:
  - deploy

deploy_to_server:
  stage: deploy
  tags:
    - lk
  only:
    - main  # или master, в зависимости от вашей ветки
  script:
    # Раннер стоит прямо на продакшен-сервере — SSH не нужен, работаем в $PROJECT_PATH напрямую.
    # ВНИМАНИЕ: на сервере нужны PHP 8.5 и pnpm той версии, что указана в package.json (packageManager):
    # `corepack enable` (pnpm подтянется сам) или `npm i -g pnpm@<версия>`.
    - cd $PROJECT_PATH
    - git pull origin main
    # composer install ДО pnpm build: vite.config.ts подключает wayfinder(), который во время сборки
    # дёргает `php artisan wayfinder:generate` — нужен уже готовый vendor/autoload.php.
    - composer install --no-dev --optimize-autoloader --no-interaction
    # devDependencies нужны для сборки (vite, vue-tsc) — pnpm ставит их по умолчанию
    - pnpm install --frozen-lockfile
    - pnpm build
    - php artisan optimize:clear
